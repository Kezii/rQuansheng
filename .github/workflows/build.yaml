name: Build
on:
  merge_group:
  pull_request:
  push:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build the project according to the steps
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Install rust nightly
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src --component rustfmt --component llvm-tools-preview
          rustup override set nightly

      - name: Configure rust target
        run: |
          rustup target add thumbv6m-none-eabi

      - name: Install flip-link
        run: |
          cargo +nightly install flip-link

      - name: Install cargo-binutils
        run: |
          cargo +nightly install cargo-binutils

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cargo check (host_sw)
        working-directory: host_sw
        run: |
          cargo check

      - name: Build flashable firmware binary
        working-directory: cross/rquansheng
        run: |
          cargo build --release --bin app
          cargo objcopy --release --bin app -- -O binary firmware.bin

      - name: Upload flashable firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: cross/rquansheng/firmware.bin
